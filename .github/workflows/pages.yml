name: Deploy Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - docs/**
      - package/icon.png
      - package/contents/ui/studio/StudioCatalog.js
      - package/contents/ui/studio/PresetCodec.js
      - package/contents/ui/studio/wallpapers/**
      - tools/sync_studio_assets.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build shared studio assets
        run: |
          python3 tools/sync_studio_assets.py
          python3 tools/sync_studio_assets.py --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website

      - id: deployment
        uses: actions/deploy-pages@v4
